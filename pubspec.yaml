# Every Flutter project has one of these. It names your app, sets the Dart
# version it needs, and lists the packages you depend on.
# Add a package with: flutter pub add <name>
name: final_project
description: ResortBook, a front-desk reservation manager for small resorts.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  # Lets you preview the app inside a phone frame while you develop in a
  # browser. It is switched off automatically in a release build.
  device_preview: ^1.3.1
  pocketbase: ^0.25.1
  # Keeps the PocketBase login across page reloads / app restarts.
  shared_preferences: ^2.5.5
  device_preview_screenshot: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Put images, fonts and sounds in assets/ and list them here, for example:
  assets:
    - assets/images/

  # Inter (from the Figma design), bundled locally — no extra package needed.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
